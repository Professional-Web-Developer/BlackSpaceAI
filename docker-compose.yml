# Local Postgres for development: `docker compose up -d`
# Then set DATABASE_URL=postgres://postgres:postgres@localhost:5432/blackspace
services:
  postgres:
    image: postgres:16-alpine
    container_name: blackspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackspace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blackspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
